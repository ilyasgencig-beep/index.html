
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ÇAKIR LIVE 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172019;color:#fff;font-family:Arial}
#v{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.box{background:#07100dcc;border:1px solid #b9995b;border-radius:10px;padding:9px 12px}
.box b{color:#e2c27f;letter-spacing:2px;font-size:12px}
.box small{display:block;color:#ddd;font-size:10px;margin-top:3px}
.controls{position:fixed;bottom:10px;left:10px;right:10px;display:flex;gap:7px;justify-content:center}
button{background:#251f16;color:#f3dca7;border:1px solid #b9995b;border-radius:8px;padding:9px 12px;font-weight:bold}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="v"></div>
<div class="hud">
<div class="box"><b>ÇAKIR LIVE 3D</b><small>İlk gerçekçi sahne · Mezarlık korteji</small></div>
<div class="box"><b>SAHNE TESTİ</b></div>
</div>
<div class="controls">
<button id="front">ÖNDEN TAKİP</button>
<button id="side">YAN KAMERA</button>
<button id="pause">DURAKLAT</button>
</div>
<script type="module">
import * as THREE from 'three';
const root=document.querySelector('#v'),scene=new THREE.Scene();
scene.background=new THREE.Color(0x788078);
scene.fog=new THREE.Fog(0x788078,22,85);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd4ded8,0x34372f,1.8));
const sun=new THREE.DirectionalLight(0xffe2bd,2.5);
sun.position.set(-9,15,9);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const soil=mat(0x394238),road=mat(0x56564e),suit=mat(0x11151a),skin=mat(0x9b7058),hair=mat(0x171411),green=mat(0x123c2c,.45),gold=mat(0xc6a35d,.3,.7);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),soil);
ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
let path=new THREE.Mesh(new THREE.PlaneGeometry(7,110),road);
path.rotation.x=-Math.PI/2;path.position.set(0,-.03,-25);scene.add(path);
for(let x of [-3.7,3.7]){
let edge=new THREE.Mesh(new THREE.BoxGeometry(.16,.12,110),mat(0x777568));
edge.position.set(x,.01,-25);scene.add(edge)}
const gate=new THREE.Group();gate.position.z=8;scene.add(gate);
for(let x of [-4.5,4.5]){
let p=new THREE.Mesh(new THREE.BoxGeometry(.7,4.6,.7),mat(0x77766d));
p.position.set(x,2.3,0);p.castShadow=true;gate.add(p);
let cap=new THREE.Mesh(new THREE.BoxGeometry(1,.3,1),gold);
cap.position.set(x,4.7,0);gate.add(cap)}
let beam=new THREE.Mesh(new THREE.BoxGeometry(9.6,.4,.5),mat(0x494a44));
beam.position.y=4.5;gate.add(beam);
for(let x=-4;x<=4;x+=.65){
let bar=new THREE.Mesh(new THREE.BoxGeometry(.07,3.4,.1),suit);
bar.position.set(x,2.3,0);gate.add(bar)}
function tree(x,z,s){
let g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.28*s,3*s,8),mat(0x514333));
tr.position.y=1.5*s;g.add(tr);
for(let i=0;i<5;i++){
let c=new THREE.Mesh(new THREE.ConeGeometry((1.3-i*.13)*s,2.3*s,8),mat(i%2?0x293c31:0x35483a));
c.position.set((Math.random()-.5)*.3*s,(2.8+i*.6)*s,0);g.add(c)}
g.position.set(x,0,z);scene.add(g)}
for(let z=-65;z<12;z+=7){tree(-7.5,z,1.1);tree(7.5,z+2,1.2)}
for(let i=0;i<22;i++){
let x=(Math.random()<.5?-1:1)*(5+Math.random()*5),z=-58+Math.random()*65,g=new THREE.Group();
let slab=new THREE.Mesh(new THREE.BoxGeometry(.6,.8,.2),mat(0x88877d));
slab.position.y=.4;g.add(slab);g.position.set(x,0,z);scene.add(g)}
function man(name,scale=1){
let g=new THREE.Group();g.userData.phase=Math.random()*6.28;
let torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34*scale,.65*scale,4,9),suit);
torso.position.y=1.15*scale;g.add(torso);
let head=new THREE.Mesh(new THREE.SphereGeometry(.25*scale,20,16),skin);
head.position.y=1.92*scale;g.add(head);
let cap=new THREE.Mesh(new THREE.SphereGeometry(.26*scale,16,10,0,Math.PI*2,0,Math.PI*.5),hair);
cap.position.y=2.03*scale;g.add(cap);
let shades=new THREE.Mesh(new THREE.BoxGeometry(.42*scale,.08*scale,.06*scale),suit);
shades.position.set(0,1.97*scale,.23*scale);g.add(shades);
let legs=[];
for(let side of [-1,1]){
let a=new THREE.Mesh(new THREE.CapsuleGeometry(.12*scale,.54*scale,3,7),suit);
a.position.set(side*.18*scale,.42*scale,0);g.add(a);legs.push(a);
let arm=new THREE.Mesh(new THREE.CapsuleGeometry(.1*scale,.52*scale,3,7),suit);
arm.position.set(side*.42*scale,1.25*scale,0);g.add(arm)}
g.userData.legs=legs;return g}
const people=[];
const names=['POLAT','MEMATİ','TAŞIYICI 3','TAŞIYICI 4'];
const coords=[[-2,1.35],[2,1.35],[-2,-1.35],[2,-1.35]];
const procession=new THREE.Group();scene.add(procession);
const coffin=new THREE.Group();procession.add(coffin);
let box=new THREE.Mesh(new THREE.BoxGeometry(2.15,.62,4.05),green);
box.position.y=2.45;box.castShadow=true;coffin.add(box);
let lid=new THREE.Mesh(new THREE.BoxGeometry(2.2,.24,4.12),green);
lid.position.y=2.88;coffin.add(lid);
for(let x of [-1.12,1.12]){
let trim=new THREE.Mesh(new THREE.BoxGeometry(.07,.09,4.2),gold);
trim.position.set(x,2.45,0);coffin.add(trim);
let rail=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,5.2,12),gold);
rail.rotation.x=Math.PI/2;rail.position.set(x*1.15,2.1,0);coffin.add(rail)}
for(let i=0;i<38;i++){
let a=Math.random()*Math.PI*2,r=.3+Math.random()*.65;
let f=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),mat(i%3===0?0xe8dfce:0x852936));
f.position.set(Math.cos(a)*r,3.04,Math.sin(a)*r*1.55);f.scale.y=.7;coffin.add(f)}
for(let i=0;i<20;i++){
let leaf=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),mat(0x31583b));
leaf.position.set((Math.random()-.5)*1.7,3.02,(Math.random()-.5)*3.4);
leaf.scale.set(.5,.2,1.6);coffin.add(leaf)}
coords.forEach((p,i)=>{
let c=man(names[i]);c.position.set(p[0],0,p[1]);c.rotation.y=Math.PI;
procession.add(c);people.push(c)});
for(let i=0;i<24;i++){
let side=i%2?-1:1,row=Math.floor(i/2),c=man('',.78);
c.position.set(side*(3.5+(i%3)*.35),0,-3.5-row*1.1);
c.rotation.y=Math.PI;procession.add(c);people.push(c)}
let mode='front',paused=false,t=0;
function cam(){
if(mode==='front'){camera.position.set(5.3,5.1,10.8);camera.lookAt(0,1.5,-1.4)}
else{camera.position.set(9.5,4.2,2.4);camera.lookAt(0,1.5,-1)}}
cam();
document.querySelector('#front').onclick=()=>{mode='front';cam()};
document.querySelector('#side').onclick=()=>{mode='side';cam()};
document.querySelector('#pause').onclick=e=>{
paused=!paused;e.target.textContent=paused?'DEVAM':'DURAKLAT'};
const clock=new THREE.Clock();
function loop(){
requestAnimationFrame(loop);
let dt=Math.min(clock.getDelta(),.04);
if(!paused){
t+=dt;procession.position.z=-((t*.55)%18);
people.forEach(p=>{
let q=t*7+p.userData.phase;
p.userData.legs[0].rotation.x=Math.sin(q)*.48;
p.userData.legs[1].rotation.x=-Math.sin(q)*.48;
p.position.y=Math.abs(Math.sin(q*2))*.025});
coffin.position.y=Math.sin(t*14)*.025}
renderer.render(scene,camera)}
loop();
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
