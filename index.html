<script type="module">
import * as THREE from 'three';

renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.toneMappingExposure=1.08;
document.querySelector('#stage').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe3e5dc,0x252a24,1.65));

sun.position.set(-12,20,12);

const mat=(c,r=.78,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={
 earth:mat(0x30372f),grass:mat(0x465044),road:mat(0x4b4b43),
 marble:mat(0xc5c1b5),stone:mat(0x88877e),
 black:mat(0x101216,.62),navy:mat(0x101b2b,.58),
 charcoal:mat(0x292b2d,.65),shirt:mat(0xe5e1d8,.7),
 tie:mat(0x17191d,.55),burgundy:mat(0x451c26,.55),
 skin:mat(0x98715c),skin2:mat(0xb08067),
 hair:mat(0x171411),shoe:mat(0x08090b,.35),
 velvet:mat(0x103b2b,.38),gold:mat(0xb58b45,.25,.65),
 flower:mat(0x8d2638),white:mat(0xe5ddd0),
 leaf:mat(0x35523b),wood:mat(0x49382b),
 chrome:mat(0x9ca5a5,.25,.8),glass:mat(0x18232a,.2,.25),
 tire:mat(0x090b0c,.95),red:mat(0x8e1517)
};

function mesh(geo,material,parent,x=0,y=0,z=0){
 const o=new THREE.Mesh(geo,material);
 o.position.set(x,y,z);
 o.castShadow=true;o.receiveShadow=true;
 parent.add(o);return o;
}
function box(parent,x,y,z,sx,sy,sz,material){
 return mesh(new THREE.BoxGeometry(sx,sy,sz),material,parent,x,y,z);
}
function bone(parent,a,b,r,material){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);
 const d=B.clone().sub(A);
 const o=mesh(new THREE.CylinderGeometry(r*.8,r,d.length(),9),material,parent);
 o.position.copy(A.add(B).multiplyScalar(.5));
 o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
 return o;
}

// Zemin
mesh(new THREE.PlaneGeometry(150,150),M.earth,scene,0,-.13,0).rotation.x=-Math.PI/2;
mesh(new THREE.PlaneGeometry(24,120),M.grass,scene,0,-.1,-25).rotation.x=-Math.PI/2;
mesh(new THREE.PlaneGeometry(8,120),M.road,scene,0,-.06,-25).rotation.x=-Math.PI/2;

// Mezarlık duvarları ve giriş

}

for(const x of [-5.2,5.2]){
 box(gate,x,2.35,0,.9,4.7,.9,M.stone);
 box(gate,x,4.85,0,1.2,.3,1.2,M.gold);
}
box(gate,0,4.7,0,10.5,.45,.7,M.stone);

box(gate,0,5.25,.2,2.6,.05,.04,M.gold);

// Servi ağaçları
function cypress(x,z,s=1){

}
for(let z=-72;z<10;z+=8){cypress(-8,z,1.1);cypress(8,z+3,1.05);}

// Mezar taşları
function grave(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);

 box(g,0,.58,-.48,.65,.95,.22,M.marble);
 mesh(new THREE.SphereGeometry(.325,16,10,0,Math.PI*2,0,Math.PI/2),M.marble,g,0,1.05,-.48).scale.set(1,.7,.45);

 const c=document.createElement('canvas');c.width=256;c.height=128;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#ded9c9';ctx.fillRect(0,0,256,128);
 ctx.fillStyle='#4b493f';ctx.textAlign='center';
 ctx.font='bold 20px serif';ctx.fillText('RUHUNA FATİHA',128,48);
 ctx.font='16px serif';ctx.fillText('Merhum / Merhume',128,78);
 ctx.fillText('Allah rahmet eylesin',128,104);
 const sign=new THREE.Mesh(new THREE.PlaneGeometry(.58,.32),
 new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));
 sign.position.set(0,.78,-.355);g.add(sign);
}
for(let i=0;i<34;i++)grave((i%2?-1:1)*(5.4+(i%3)*1.1),-66+Math.floor(i/2)*4.1);

// BMW L7 E38
function makeBMW(){
 const car=new THREE.Group();scene.add(car);
 car.position.set(7,0,7);car.rotation.y=-.18;
 box(car,0,.78,0,2.05,.55,5.35,M.black);
 box(car,0,1.05,-.1,1.98,.38,4.95,M.black);
 box(car,0,1.39,-.25,1.78,.85,3.15,M.black);
 box(car,0,1.57,-.25,1.79,.57,3.05,M.glass);
 box(car,0,1.59,-1.95,1.8,.55,1.1,M.glass);
 box(car,0,1.59,1.45,1.8,.55,.85,M.glass);
 box(car,0,2,-.2,1.85,.16,3.25,M.black);
 box(car,0,1.05,-2.1,1.95,.25,1.1,M.black);
 box(car,0,1.05,2.2,1.95,.25,.85,M.black);
 for(const x of [-.17,.17]){
  box(car,x,1.04,-2.72,.22,.3,.08,M.chrome);
  for(let j=0;j<4;j++)box(car,x,1.04,-2.77,.025,.24,.025,M.black);
 }
 for(const x of [-.68,.68]){
  box(car,x,1.15,-2.72,.48,.2,.12,M.chrome);
  box(car,x,1.15,-2.79,.3,.12,.04,M.white);
  box(car,x,1.02,2.69,.38,.18,.08,M.red);
 }
 for(const x of [-1.03,1.03])for(const z of [-1.75,1.75]){
  const w=mesh(new THREE.CylinderGeometry(.43,.43,.2,24),M.tire,car,x,.48,z);w.rotation.z=Math.PI/2;
  const r=mesh(new THREE.CylinderGeometry(.23,.23,.22,16),M.chrome,car,x,.48,z);r.rotation.z=Math.PI/2;
 }
 for(const x of [-1,1]){
  box(car,x*1.01,.94,-.3,.025,.035,2.4,M.chrome);
  box(car,x*1.08,1.3,-1.4,.24,.12,.22,M.black);
 }
 const c=document.createElement('canvas');c.width=512;c.height=128;
 const ctx=c.getContext('2d');ctx.fillStyle='#f4f4ed';ctx.fillRect(0,0,512,128);
 ctx.fillStyle='#173d75';ctx.fillRect(0,0,55,128);
 ctx.fillStyle='white';ctx.font='bold 70px Arial';ctx.textAlign='center';ctx.fillText('TR',27,85);
 ctx.fillStyle='#111';ctx.font='bold 76px Arial';ctx.fillText('34 TK 053',285,88);
 const p=new THREE.Mesh(new THREE.PlaneGeometry(1.05,.26),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));
 p.position.set(0,1,-2.79);car.add(p);

makeBMW();

// Takım elbiseli karakter
function person(o={}){
 const scale=o.scale||1;
 const skin=o.skin||M.skin;
 const suit=o.suit||M.black;
 const shirt=o.shirt||M.shirt;
 const tieMat=o.tie||M.tie;
 const g=new THREE.Group();

 // Pantolon: iki ayrı kumaş bacak
 const legs=[];
 for(const side of [-1,1]){
  const hip=new THREE.Group();
  hip.position.set(side*.16*scale,.83*scale,0);
  g.add(hip);
  mesh(new THREE.CapsuleGeometry(.115*scale,.38*scale,5,10),suit,hip,0,-.22*scale,0);

  const knee=new THREE.Group();
  knee.position.set(0,-.43*scale,0);hip.add(knee);
  mesh(new THREE.CapsuleGeometry(.09*scale,.34*scale,5,10),suit,knee,0,-.18*scale,0);

  const foot=new THREE.Group();foot.position.set(0,-.38*scale,.03*scale);knee.add(foot);
  // Parlak klasik deri ayakkabı
  const shoe=mesh(new THREE.BoxGeometry(.19*scale,.105*scale,.34*scale),M.shoe,foot,0,-.025*scale,.09*scale);
  shoe.scale.z=1.05;
  legs.push({hip,knee,foot,side});
 }

 // Bel ve ceket
 const waist=mesh(new THREE.CylinderGeometry(.235*scale,.26*scale,.23*scale,12),suit,g,0,.84*scale,0);
 const torso=new THREE.Group();torso.position.set(0,1.13*scale,0);g.add(torso);
 mesh(new THREE.CapsuleGeometry(.29*scale,.48*scale,5,12),suit,torso,0,.12*scale,0);

 // Gömlek gövdesi ve açık yakalı değil, klasik yakalı gömlek
 box(torso,0,.15*scale,.276*scale,.29*scale,.43*scale,.035*scale,shirt);
 const collarL=mesh(new THREE.BoxGeometry(.13*scale,.12*scale,.045*scale),shirt,torso,-.075*scale,.39*scale,.30*scale);
 collarL.rotation.z=-.28;
 const collarR=mesh(new THREE.BoxGeometry(.13*scale,.12*scale,.045*scale),shirt,torso,.075*scale,.39*scale,.30*scale);
 collarR.rotation.z=.28;

 // Ceket ön panelleri
 for(const side of [-1,1]){
  const lapel=mesh(new THREE.BufferGeometry(),suit,torso);
  const shape=new THREE.Shape();
  shape.moveTo(0,0);shape.lineTo(.12*scale,.34*scale);shape.lineTo(.23*scale,.22*scale);
  shape.lineTo(.12*scale,-.12*scale);shape.closePath();
  const geo=new THREE.ShapeGeometry(shape);
  lapel.geometry.dispose();lapel.geometry=geo;
  lapel.position.set(side*.02*scale,.23*scale,.31*scale);
  lapel.scale.x=side;
  const button=mesh(new THREE.SphereGeometry(.022*scale,8,8),M.gold,torso,side*.14*scale,.05*scale,.318*scale);
 }

 // Kravat
 const knot=mesh(new THREE.BoxGeometry(.075*scale,.075*scale,.045*scale),tieMat,torso,0,.34*scale,.325*scale);
 const tie=mesh(new THREE.CylinderGeometry(.025*scale,.065*scale,.34*scale,4),tieMat,torso,0,.13*scale,.325*scale);
 tie.rotation.x=Math.PI;

 // Ceket cepleri ve cep mendili
 for(const side of [-1,1]){
  box(torso,side*.19*scale,.02*scale,.305*scale,.13*scale,.025*scale,.018*scale,M.black);
 }
 box(torso,.17*scale,.29*scale,.322*scale,.09*scale,.035*scale,.025*scale,shirt);

 // Boyun
 mesh(new THREE.CylinderGeometry(.085*scale,.095*scale,.18*scale,12),skin,g,0,1.55*scale,0);

 // Kafa - kesinlikle şapka yok
 const head=new THREE.Group();head.position.set(0,1.88*scale,0);g.add(head);
 mesh(new THREE.SphereGeometry(.235*scale,20,16),skin,head);

 // Kısa, doğal saç: yalnızca kafanın üst ve arka kısmında
 const hair=mesh(new THREE.SphereGeometry(.238*scale,20,12,0,Math.PI*2,0,Math.PI*.39),M.hair,head,0,.075*scale,-.005*scale);
 hair.scale.set(1,.75,1);

 // Kulaklar, burun ve kaşlar
 for(const side of [-1,1]){
  mesh(new THREE.SphereGeometry(.05*scale,10,8),skin,head,side*.23*scale,-.005*scale,0);
  box(head,side*.09*scale,.055*scale,.205*scale,.11*scale,.025*scale,.035*scale,M.hair);
 }
 mesh(new THREE.ConeGeometry(.045*scale,.12*scale,8),skin,head,0,-.015*scale,.22*scale).rotation.x=Math.PI/2;

 // Gözler
 for(const side of [-1,1]){
  mesh(new THREE.SphereGeometry(.022*scale,8,8),M.black,head,side*.085*scale,.015*scale,.21*scale);
 }

 // Kollar: üst kol ve ön kol
 const arms=[];
 for(const side of [-1,1]){
  const shoulder=new THREE.Group();
  shoulder.position.set(side*.32*scale,1.38*scale,0);g.add(shoulder);
  bone(shoulder,[0,0,0],[side*.055*scale,-.39*scale,0],.105*scale,suit);
  const elbow=new THREE.Group();
  elbow.position.set(side*.055*scale,-.39*scale,0);shoulder.add(elbow);
  bone(elbow,[0,0,0],[side*.025*scale,-.37*scale,.02*scale],.08*scale,suit);
  mesh(new THREE.SphereGeometry(.075*scale,10,8),skin,elbow,side*.025*scale,-.39*scale,.02*scale);
  arms.push({shoulder,elbow,side});
 }

 g.userData={legs,arms,torso,head,phase:Math.random()*6.28};
 return g;
}

// Lider karakterler: takım elbiseli, şapkasız
function leader(type){
 const p=person({
  scale:1.07,
  skin:type==='polat'?M.skin:M.skin2,
  suit:type==='polat'?M.black:M.charcoal,
  shirt:M.shirt,
  tie:type==='polat'?M.tie:M.burgundy
 });
 const head=p.userData.head;

 if(type==='polat'){
  // Geriye taranmış kısa saç, ciddi yüz
  const hair=mesh(new THREE.SphereGeometry(.24,20,12,0,Math.PI*2,0,Math.PI*.42),M.hair,head,0,.09,-.015);
  hair.scale.set(1,.7,1);
  // Koyu gözlük
  for(const side of [-1,1]){
   box(head,side*.09,.035,.215,.18,.07,.045,M.black);
  }
  box(head,0,.035,.22,.04,.025,.04,M.gold);
 }else{
  // Kısa saç ve daha sert yüz hatları
  const hair=mesh(new THREE.SphereGeometry(.24,18,10,0,Math.PI*2,0,Math.PI*.42),M.hair,head,0,.085,-.015);
  hair.scale.set(1,.72,1);
  // Hafif kirli sakal görünümü
  mesh(new THREE.SphereGeometry(.17,12,8,0,Math.PI*2,Math.PI*.55,Math.PI*.4),M.hair,head,0,-.12,.035);
 }
 return p;
}

// Tabut ve kortej
const cortege=new THREE.Group();scene.add(cortege);
const coffin=new THREE.Group();cortege.add(coffin);

box(coffin,0,2.03,0,1.72,.58,3.25,M.velvet);
box(coffin,0,2.38,0,1.82,.22,3.35,M.velvet);
box(coffin,0,2.51,0,1.45,.035,2.85,M.gold);

for(const x of [-.9,.9]){
 box(coffin,x,2.05,0,.07,.13,3.45,M.gold);
 for(const z of [-1.2,-.6,0,.6,1.2])
  mesh(new THREE.SphereGeometry(.07,10,8),M.gold,coffin,x,2.53,z);
 // Uzun taşıma direği
 const pole=mesh(new THREE.CylinderGeometry(.065,.065,5.6,14),M.gold,coffin,x*1.5,1.86,0);
 pole.rotation.x=Math.PI/2;
}
for(let i=0;i<48;i++){
 const a=Math.random()*Math.PI*2,r=.15+Math.random()*.6;
 const f=mesh(new THREE.SphereGeometry(.085,10,8),i%4===0?M.white:M.flower,coffin,Math.cos(a)*r,2.57,Math.sin(a)*r*1.4);
 f.scale.y=.7;
}

// Altı taşıyıcı, iki yanda üç kişi
const carriers=[];
for(const side of [-1,1]){
 for(let i=0;i<3;i++){
  const p=person({
   skin:i%2?M.skin:M.skin2,
   suit:[M.black,M.navy,M.charcoal][i%3],
   tie:i%2?M.tie:M.burgundy
  });
  p.position.set(side*1.95,0,[-1.65,0,1.65][i]);
  p.rotation.y=Math.PI;
  cortege.add(p);
  p.userData.carrierSide=side;
  p.userData.walkPhase=i*.65*Math.PI+(side===1?Math.PI:0);
  carriers.push(p);
 }
}

// Liderler kortejin önünde
const polat=leader('polat');
polat.position.set(-.85,0,-4.05);polat.rotation.y=Math.PI;cortege.add(polat);
const memati=leader('memati');
memati.position.set(.85,0,-4.05);memati.rotation.y=Math.PI;cortege.add(memati);

// Arka kalabalık
const crowd=[];
for(let i=0;i<20;i++){
 const p=person({
  scale:.92,
  skin:i%3===0?M.skin2:M.skin,
  suit:[M.black,M.navy,M.charcoal][i%3],
  tie:M.tie
 });
 p.position.set((i%2?-1:1)*(3.2+(i%3)*.4),0,2.9+Math.floor(i/2)*.85);
 p.rotation.y=Math.PI;cortege.add(p);crowd.push(p);
}

// Fenerler
for(const side of [-1,1])for(let z=-48;z<8;z+=12){
 mesh(new THREE.CylinderGeometry(.06,.08,2.2,10),M.black,scene,side*4.9,1.1,z);
 box(scene,side*4.9,2.3,z,.38,.42,.38,M.gold);
 const light=new THREE.PointLight(0xffc77b,.5,7);
 light.position.set(side*4.9,2.3,z);scene.add(light);
}

// Kamera yönleri
let mode='front',paused=false,elapsed=0;
const goalPos=new THREE.Vector3(),goalLook=new THREE.Vector3(),look=new THREE.Vector3();

function cameraTargets(){
 const z=cortege.position.z;
 if(mode==='front'){
  // Kortejin önünde, yüzlere ve tabuta bakan kamera
  goalPos.set(0,4.1,z-10.5);
  goalLook.set(0,1.55,z+.2);
  camera.fov=43;
 }else if(mode==='side'){
  goalPos.set(10,4.2,z+.2);
  goalLook.set(0,1.5,z-.2);
  camera.fov=46;
 }else{
  goalPos.set(12,8.5,z-11);
  goalLook.set(1,1.1,z);
  camera.fov=53;
 }
 camera.updateProjectionMatrix();
}
document.querySelector('#front').onclick=()=>mode='front';
document.querySelector('#side').onclick=()=>mode='side';
document.querySelector('#wide').onclick=()=>mode='wide';
document.querySelector('#pause').onclick=e=>{
 paused=!paused;e.currentTarget.textContent=paused?'DEVAM':'DURAKLAT';
};

function walk(p,t,amount=.6){
 const d=p.userData,phase=t*3.3+(d.phase||0);
 d.legs.forEach((leg,i)=>{
  const a=Math.sin(phase+(i?Math.PI:0))*.34*amount;
  leg.hip.rotation.x=a;
  leg.knee.rotation.x=Math.max(0,Math.sin(phase+(i?0:Math.PI)))*.42*amount;
  leg.foot.rotation.x=-leg.knee.rotation.x*.4-a*.12;
 });
 d.arms.forEach((arm,i)=>{
  arm.shoulder.rotation.x=Math.sin(phase+(i?0:Math.PI))*.22*amount;
  arm.elbow.rotation.x=-.2;
 });
 d.torso.rotation.z=Math.sin(phase)*.01;
 d.head.rotation.y=Math.sin(phase*.5)*.015;
}

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(!paused){
  elapsed+=dt;
  cortege.position.z=-((elapsed*.32)%18);
  coffin.position.y=Math.sin(elapsed*3.3)*.015;
  coffin.rotation.z=Math.sin(elapsed*1.6)*.003;

  carriers.forEach(p=>{
   const phase=elapsed*3.3+p.userData.walkPhase;
   p.userData.legs.forEach((leg,i)=>{
    const a=Math.sin(phase+(i?Math.PI:0))*.2;
    leg.hip.rotation.x=a;
    leg.knee.rotation.x=Math.max(0,Math.sin(phase+(i?0:Math.PI)))*.24;
    leg.foot.rotation.x=-leg.knee.rotation.x*.3;
   });
   // Taşıma sırasında kollar vücuda yakın tutulur.
   p.userData.arms.forEach(arm=>{
    arm.shoulder.rotation.x=0;
    arm.elbow.rotation.x=-.12;
   });
  });
  walk(polat,elapsed,.55);
  walk(memati,elapsed,.55);
  crowd.forEach(p=>walk(p,elapsed,.6));
 }

 cameraTargets();
 const k=1-Math.exp(-3.5*dt);
 camera.position.lerp(goalPos,k);
 look.lerp(goalLook,k);
 camera.lookAt(look);
 renderer.render(scene,camera);
}
cameraTargets();
camera.position.copy(goalPos);look.copy(goalLook);camera.lookAt(look);
animate();

document.querySelector('#loading').remove();
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
